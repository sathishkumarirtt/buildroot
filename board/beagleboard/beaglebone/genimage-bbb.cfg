image boot.vfat {
	vfat {
		files = {
			"MLO",
			"uImage",
			"am335x-boneblack.dtb",
			"args"
		}
	}

	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition spl {
		in-partition-table = "no"
		offset = 128K
		image = "MLO"
	}

	partition u-boot-img {
		in-partition-table = "no"
		offset = 0x60000
		image = "u-boot.img"
	}

	partition falcon-args {
		in-partition-table = "no"
		offset = 0x2A0000
		size = 256K
		image = "args"
	}

	partition falcon-kernel {
		in-partition-table = "no"
		offset = 0x2E0000
		size = 12M
		image = "uImage"
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		offset = 16M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}
}
